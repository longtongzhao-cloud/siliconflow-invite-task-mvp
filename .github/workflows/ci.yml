name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mvp/requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r mvp/requirements-dev.txt
          python -m pip check

      - name: Audit Python dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r mvp/requirements-dev.txt

      - name: Run MVP tests
        shell: pwsh
        working-directory: mvp
        run: python -m pytest -q

      - name: Run deterministic validation checks
        shell: pwsh
        working-directory: tech-validation
        run: |
          .\test-task-rules.ps1
          .\test-task-concurrency.ps1
          python .\test-session-security.py
          .\test-sensitive-output.ps1
