server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 300 always;
        return 503;
    }

    location ~ /\. {
        deny all;
    }
}
